name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Audit dependencies
        run: npm audit --audit-level=moderate

      - name: Audit Rust dependencies
        working-directory: src-tauri
        run: |
          cargo install cargo-audit
          cargo audit

      # `cargo audit` controlla il Cargo.lock committato: se il lockfile fosse
      # disallineato rispetto a Cargo.toml, la release (che ora usa `--locked`)
      # compilerebbe un albero diverso. Fallisce qui, in pochi secondi e senza
      # compilare, invece che al momento del tag.
      - name: Check Cargo.lock is in sync
        working-directory: src-tauri
        run: cargo metadata --locked --format-version 1 > /dev/null

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Esegue anche la build in modalità Tauri, che attiva il prerendering SPA.
      # È il percorso che `npm run build` non tocca, e in cui è passata inosservata
      # la regressione di @tanstack/react-router 1.170.25 (vedi CHANGELOG 2.0.3).
      - name: Build (Tauri mode)
        run: npm run build:tauri
